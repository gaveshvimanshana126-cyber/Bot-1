name: Run DANUWA-MD

on:
  workflow_dispatch:          # Actions tab එකෙන් manual start
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */6 * * *'     # පැය 6කට සැරයක් restart

concurrency:
  group: bot
  cancel-in-progress: true    # එකම session එකෙන් bot දෙන්නෙක් run වෙන්න දෙන්නේ නැහැ

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # job එකකට උපරිම පැය 6යි

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: npm install

      - run: node index.js
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
          ALIVE_IMG: ${{ secrets.ALIVE_IMG }}
          ALIVE_MSG: ${{ secrets.ALIVE_MSG }}
